<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earwave Experience</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #020202, #050505, #000);
      font-family: 'Poppins', sans-serif;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      animation: fadeOut 2.5s ease forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    h1 {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      font-size: 3.5rem;
      letter-spacing: 4px;
      color: white;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeIn 2.5s ease 2s forwards;
    }

    h2 {
      position: absolute;
      bottom: 5%;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 2s ease 3.5s forwards;
      color: #aaa;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    #cta {
      position: absolute;
      top: 10%;
      left: 43%;
      transform: translateX(-50%);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 12px 28px;
      border-radius: 40px;
      color: #fff;
      font-size: 0.9rem;
      letter-spacing: 1px;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.4s ease;
      opacity: 0;
      animation: fadeIn 2s ease 4.2s forwards;
    }

    #cta:hover {
      background: rgba(0,150,255,0.15);
      letter-spacing: 2px;
      transform: translateX(-50%) scale(1.1);
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <h1>Feel The Sound</h1>
  <h2>Immersive. Minimal. Alive.</h2>
  <a href = "homepage.html">
  <div id="cta">Explore More ↓</div>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.z = 3;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // LIGHTS - soft gradient lighting
    const light1 = new THREE.PointLight(0x0088ff, 1.2);
    const light2 = new THREE.PointLight(0xff66cc, 1.0);
    const light3 = new THREE.PointLight(0xffffff, 0.3);
    light1.position.set(3, 2, 2);
    light2.position.set(-3, -2, -2);
    light3.position.set(0, 5, -5);
    scene.add(light1, light2, light3);

    // CURVE - earphone/soundwave shape
    const curve = new THREE.CatmullRomCurve3(
      Array.from({ length: 120 }, (_, i) => {
        const t = i / 15;
        return new THREE.Vector3(Math.sin(t*1.5)*1.5, Math.cos(t*1.2)*0.4, Math.cos(t)*0.6);
      })
    );
    const tubeGeo = new THREE.TubeGeometry(curve, 200, 0.05, 12, false);
    const tubeMat = new THREE.MeshStandardMaterial({
      color: 0x00aaff,
      metalness: 0.7,
      roughness: 0.25,
      emissive: 0x005577,
      emissiveIntensity: 0.8
    });
    const tube = new THREE.Mesh(tubeGeo, tubeMat);
    scene.add(tube);

    // PARTICLES - floating dust + shimmer
    const particlesGeo = new THREE.BufferGeometry();
    const count = 2500;
    const posArray = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 10;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMat = new THREE.PointsMaterial({
      size: 0.02,
      color: 0x00aaff,
      transparent: true,
      opacity: 0.6
    });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // Animation
    const clock = new THREE.Clock();
    document.addEventListener("mousemove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      camera.position.x = x * 0.6;
      camera.position.y = -y * 0.4;
      camera.lookAt(0, 0, 0);
    });

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      tube.rotation.y = t * 0.15;
      tube.rotation.x = Math.sin(t * 0.3) * 0.1;

      particles.rotation.y += 0.0008;
      particles.rotation.x += 0.0003;

      light1.intensity = 1.2 + Math.sin(t) * 0.4;
      light2.intensity = 1.0 + Math.cos(t * 0.8) * 0.3;

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    

  </script>
</body>
</html>
